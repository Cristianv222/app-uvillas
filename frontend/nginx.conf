server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 6m;
    location /api/ {
        set $api_backend backend:8000;
        proxy_pass http://$api_backend;
        proxy_set_header Host localhost;
        proxy_read_timeout 90s;
    }
    location / { try_files $uri $uri/ /index.html; }
    # PWA: el service worker no se guarda en caché para que las actualizaciones lleguen.
    location = /sw.js { try_files $uri =404; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
}
